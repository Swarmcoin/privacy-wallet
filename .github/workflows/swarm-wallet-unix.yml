name: SWARM wallet Linux and macOS test build

# Its own workflow rather than more jobs on the Windows one, so a Linux or
# macOS failure never costs the Windows build and either can be re-run alone.
# Tag-started for the same reason as the Windows build: `workflow_dispatch`
# only fires for workflows on the default branch, and this one is not there.
on:
  workflow_dispatch:
    inputs:
      network_profile:
        description: 'Which SWARM network this build is for: swarm-testnet or swarm-mainnet'
        required: false
        default: 'swarm-testnet'
        type: choice
        options: [swarm-testnet, swarm-mainnet]
      verify_signed_intel:
        description: 'Verify the published signed Intel DMG on an Intel Mac'
        type: boolean
        default: false
      signed_intel_tag:
        description: 'Published signed wallet release tag to verify; must match this source version'
        type: string
        default: ''
  push:
    tags:
      - "swarm-unix-*"

permissions:
  contents: read

env:
  CARGO_PROFILE_RELEASE_DEBUG: "0"
  CARGO_PROFILE_RELEASE_LTO: "false"
  CARGO_INCREMENTAL: "0"
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  # CI produces unsigned integration artifacts. The owner Mac uses the
  # separate Developer ID config and a local Keychain notarytool profile.
  CSC_IDENTITY_AUTO_DISCOVERY: "false"
  RUSTUP_TOOLCHAIN: "1.96.0"
  RUSTFLAGS: '--cfg zcash_unstable="nu6.3"'
  SWARM_SDK_REV: "c7464d2ec40a5d619500a9ebee76ac4c39775baa"

jobs:
  unix-wallet:
    if: ${{ !inputs.verify_signed_intel }}
    strategy:
      # One platform failing must not cancel the other: a macOS toolchain
      # problem should still leave a Linux package to ship.
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: ubuntu-22.04
            arch: x64
            # 22.04 rather than latest: the glibc a binary is built against is
            # the oldest it will run on, so building on the older image is what
            # lets the AppImage work on both 22.04 and 24.04.
            electron_flags: "--linux --x64"
          - platform: mac-arm64
            runner: macos-14
            arch: arm64
            electron_flags: "--mac --arm64"
          # Cross-compiled on an arm64 host. The macos-13 Intel pool stopped
          # picking up jobs — a mac-x64 job sat queued on it for over two hours
          # — so the Intel build is produced here instead, with every target
          # named explicitly and the result verified by check-swarm-macho-arch.
          - platform: mac-x64
            runner: macos-14
            arch: x64
            electron_flags: "--mac --x64"
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Check out the pinned SDK revision
        uses: actions/checkout@v4
        with:
          repository: Swarm-Official/privacy-zingolib
          ref: c7464d2ec40a5d619500a9ebee76ac4c39775baa
          path: sdk-source
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: yarn
      - name: Restore compiled Rust outputs
        id: rust-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/target
          key: swarm-${{ matrix.platform }}-rust196-nu63-${{ hashFiles('native/Cargo.lock', 'native/src/lib.rs', 'sdk/swarm-sdk-pin.json') }}
          restore-keys: swarm-${{ matrix.platform }}-rust196-nu63-
      - name: Install build prerequisites
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          rustup default 1.96.0
          npm install --global yarn@1.22.22
      # mac-x64 is built on an arm64 host, so the Intel standard library is not
      # the host's and has to be asked for. Both cargo invocations below name
      # --target x86_64-apple-darwin already; without this they fail outright
      # rather than quietly producing an arm64 binary, but there is no reason
      # to spend an hour of compilation finding that out.
      - name: Add the Intel Rust target for the cross-build
        if: matrix.platform == 'mac-x64'
        run: rustup target add x86_64-apple-darwin
      - name: Install protoc (Linux)
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Install protoc (macOS)
        if: startsWith(matrix.platform, 'mac')
        run: brew install protobuf
      - name: Install locked JavaScript dependencies
        run: yarn install --frozen-lockfile
      # Which network this build is for, written into the tree before anything
      # reads it: the renderer's branding, the version, the product name, the
      # app id and the package file names all come from src/buildProfile.json.
      # Default swarm-testnet, so a `swarm-unix-*` tag push keeps producing
      # exactly what it produced before.
      - name: Select the network this build is for
        run: node scripts/set-build-profile.js
        env:
          SWARM_NETWORK_PROFILE: ${{ inputs.network_profile || 'swarm-testnet' }}
      - name: Validate the complete packaging configuration
        run: node scripts/check-swarm-package-config.js
      # Everything cheap that can refuse the build runs before the hour of
      # compilation, not after it.
      - name: Verify the pinned SDK revision and its network
        run: node scripts/check-swarm-sdk-pin.js sdk-source --require-real-genesis
      - name: Check the lockfile resolves without changes
        run: cargo fetch --locked --manifest-path native/Cargo.toml
      - name: Generate the empty optional swap configuration
        run: node scripts/generate-swapkit-secrets.js
      - name: Check the frontend types
        run: yarn tsc --noEmit
      - name: Prevent overlapping payments and misleading cancellation
        run: node scripts/test.js --watchAll=false --runInBand src/rpc/sendTransaction.test.ts src/components/errorModal/ErrorModal.test.tsx
      - name: Keep wallet sessions and mining receipts isolated
        run: node scripts/test.js --watchAll=false --runInBand src/rpc/walletSession.test.ts src/rpc/fetchValueTransferData.test.ts src/components/swarm/swarmModel.test.ts
      - name: Verify network, endpoint and server-selection boundaries
        run: node scripts/test.js --watchAll=false --runInBand src/utils/fetchServerList.test.ts src/utils/utils.test.ts src/components/addNewWallet/AddNewWallet.test.tsx src/components/dashboard/Dashboard.test.tsx src/components/send/Send.test.tsx src/components/walletBar/SelectWallet.test.tsx src/utils/swarmAddress.test.ts src/mainnetWording.test.tsx
      # The same treasury gate the Windows build runs. The last two read
      # public/ as text: the main process and the preload are never bundled
      # and never linted, so a handler reading a name it cannot see or a
      # native call the preload never exposes is otherwise first found in a
      # package.
      - name: Check the treasury custody surface
        run: node scripts/test.js --watchAll=false --runInBand src/treasury src/components/swarm/components/PassphrasePrompt.test.tsx src/components/swarm/screens/TreasuryScreen.test.tsx src/nativeSurface.test.ts src/mainProcessScope.test.ts
      - name: Build the pinned wallet SDK adapter
        run: yarn ${{ matrix.platform == 'linux' && 'neon' || (matrix.arch == 'arm64' && 'neon-mac-arm64' || 'neon-mac-x64') }}
      # The Windows build runs the same. Linux only here: it is the leg whose
      # adapter is built without `--target`, so the test binary reuses every
      # dependency the build above compiled.
      - name: Prove the addon names SWARM Mainnet addresses and prices payments to them
        if: matrix.platform == 'linux'
        run: cargo test --release --manifest-path native/Cargo.toml -p zingolib-native --lib -- parse_address_tests production_wallet
      - name: Verify native prefix compatibility
        if: matrix.platform != 'mac-x64'
        run: node scripts/check-swarm-prefix-native.js
      - name: Verify native payment URI parsing
        if: matrix.platform != 'mac-x64'
        run: node scripts/test.js --watchAll=false --runInBand src/utils/uris.test.js
      - name: Check Rust dependency pins
        run: git diff --exit-code -- native/Cargo.lock
      - name: Build the matching upstream transport helper
        run: node scripts/stage-nym-proxy.js --strict-rev --target ${{ matrix.platform == 'linux' && 'x86_64-unknown-linux-gnu' || (matrix.arch == 'arm64' && 'aarch64-apple-darwin' || 'x86_64-apple-darwin') }}
      - name: Save successful Rust outputs before packaging
        if: steps.rust-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/target
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}
      - name: Build the desktop frontend
        run: yarn script:build
        env:
          CI: ""
      - name: Check the renderer shows no upstream naming
        run: node scripts/check-swarm-bundle-strings.js --renderer build/static/js
      - name: Package the unsigned test wallet
        run: yarn electron-builder ${{ matrix.electron_flags }} --config configs/swarm-builder.cjs --publish never
      - name: Check every declared package target was produced
        run: node scripts/check-swarm-dist-targets.js ${{ matrix.platform == 'linux' && 'linux' || 'mac' }}
      - name: Record whether the wallet server was reachable from this runner
        run: node scripts/swarm-reachability.js
      - name: Check the packaged application shows no upstream naming
        run: node scripts/check-swarm-bundle-strings.js --asar dist --renderer build/static/js
      # The cross-build's own check. A single host-architecture binary inside
      # the bundle produces a package that installs, launches, and dies when it
      # loads that file — and nobody here has an Intel Mac to find that out on.
      - name: Check every binary is built for this platform's architecture
        if: startsWith(matrix.platform, 'mac')
        run: node scripts/check-swarm-macho-arch.js ${{ matrix.platform }}
      # A package nobody has started is a guess. These do not go past the
      # unlock screen and create no wallet; they answer one question only —
      # does the thing we are about to publish run at all on this platform.
      - name: Smoke-test the AppImage under a virtual display
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get install -y xvfb libfuse2
          node scripts/swarm-smoke.js linux
      # An x64 application on an arm64 host needs Rosetta, which is not listed
      # in the macos-14 arm64 image's installed software. This asks for it
      # rather than assuming either way: idempotent where it is already there,
      # and where it cannot be had the smoke test is skipped *loudly* below
      # instead of quietly passing.
      - name: Enable Rosetta so the cross-built Intel app can be started
        id: rosetta
        if: matrix.platform == 'mac-x64'
        continue-on-error: true
        run: softwareupdate --install-rosetta --agree-to-license
      - name: Smoke-test the packaged application
        if: startsWith(matrix.platform, 'mac') && (matrix.platform != 'mac-x64' || steps.rosetta.outcome == 'success')
        run: node scripts/swarm-smoke.js mac
      - name: Say plainly that the Intel application was never started
        if: matrix.platform == 'mac-x64' && steps.rosetta.outcome != 'success'
        run: |
          echo "::warning title=Intel build not smoke-tested::Rosetta 2 could not be installed on this arm64 runner, so the cross-built Intel application was packaged but never started. Its architecture is verified by check-swarm-macho-arch, but no one has watched it run."
      # Whatever the smoke test saw, kept whether it passed or failed: the
      # screen, the renderer console, the profile tree and the process output.
      # A failure should cost one look, not another three-platform cycle.
      - name: Keep what the smoke test saw
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swarm-smoke-diagnostics-${{ matrix.platform }}-${{ inputs.network_profile || 'swarm-testnet' }}
          path: dist/smoke-diagnostics/
          if-no-files-found: ignore
          retention-days: 14
      - name: Record build provenance and checksums
        run: |
          git rev-parse HEAD > dist/source-commit.txt
          cp native/Cargo.lock dist/Cargo.lock
          cp sdk-integration.json dist/sdk-integration.json
          cp src/buildProfile.json dist/build-profile.json
          cd dist && shasum -a 256 *.AppImage *.deb *.dmg *.zip > SHA256SUMS 2>/dev/null || true
          cat dist/SHA256SUMS 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: swarm-wallet-${{ matrix.platform }}-unsigned-${{ inputs.network_profile || 'swarm-testnet' }}
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.dmg
            dist/*.zip
            dist/SHA256SUMS
            dist/source-commit.txt
            dist/Cargo.lock
            dist/sdk-integration.json
            dist/build-profile.json
          retention-days: 14

  verify-signed-intel:
    if: ${{ inputs.verify_signed_intel }}
    runs-on: macos-15-intel
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Download the published signed Intel packages
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED_INTEL_TAG: ${{ inputs.signed_intel_tag }}
        run: |
          set -euo pipefail
          version=$(sed -n 's/.*APP_VERSION = "\([^"]*\)".*/\1/p' src/version.ts | head -1)
          test -n "$version"
          test "$SIGNED_INTEL_TAG" = "swarm-wallet-$version"
          mkdir -p signed-intel
          gh release download "$SIGNED_INTEL_TAG" \
            --repo Swarm-Official/swarm-releases \
            --pattern "SWARM-Wallet-$version-x64.*" \
            --pattern 'SHA256SUMS-mac-x64' --dir signed-intel
          cd signed-intel
          shasum -a 256 -c SHA256SUMS-mac-x64
      - name: Verify Gatekeeper and launch the exact signed DMG app
        run: |
          set -euo pipefail
          version=$(sed -n 's/.*APP_VERSION = "\([^"]*\)".*/\1/p' src/version.ts | head -1)
          dmg="signed-intel/SWARM-Wallet-$version-x64.dmg"
          hdiutil verify "$dmg"
          xcrun stapler validate "$dmg"
          hdiutil attach -readonly -nobrowse -mountpoint /Volumes/SWARM-Wallet-Intel-Verify "$dmg"
          app='/Volumes/SWARM-Wallet-Intel-Verify/SWARM Wallet Testnet.app'
          node scripts/check-swarm-macho-arch.js mac-x64 /Volumes/SWARM-Wallet-Intel-Verify
          codesign --verify --deep --strict "$app"
          spctl --assess --type execute --verbose=4 "$app"
          xcrun stapler validate "$app"
          node scripts/check-swarm-prefix-native.js "$app/Contents/Resources/app.asar.unpacked/build/native.node"
          SWARM_DIST=/Volumes/SWARM-Wallet-Intel-Verify \
            SWARM_SMOKE_DIAGNOSTICS="$RUNNER_TEMP/swarm-wallet-intel-smoke" \
            node scripts/swarm-smoke.js mac
          ditto -x -k "signed-intel/SWARM-Wallet-$version-x64.zip" signed-intel/zip-app
          codesign --verify --deep --strict 'signed-intel/zip-app/SWARM Wallet Testnet.app'
      - name: Detach the test image
        if: always()
        run: hdiutil detach /Volumes/SWARM-Wallet-Intel-Verify || true
      - name: Keep Intel smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: signed-intel-smoke-diagnostics
          path: ${{ runner.temp }}/swarm-wallet-intel-smoke
          if-no-files-found: ignore
