name: SWARM wallet Windows test build

# Two ways in, because `workflow_dispatch` only fires for workflows that are
# on the repository's default branch, and this one lives on `swarm-wallet`
# while the default is still the Privacy Testnet branch. Pushing a
# `swarm-build-*` tag starts exactly one run from exactly that commit, which
# is what a build of a specific tree should be anyway. The dispatch trigger is
# kept for the day this branch becomes the default.
on:
  workflow_dispatch:
    inputs:
      network_profile:
        description: 'Which SWARM network this build is for: swarm-testnet or swarm-mainnet'
        required: false
        default: 'swarm-testnet'
        type: choice
        options: [swarm-testnet, swarm-mainnet]
  push:
    tags:
      - "swarm-build-*"

permissions:
  contents: read

jobs:
  windows-wallet:
    runs-on: windows-2025
    timeout-minutes: 180
    env:
      CARGO_BUILD_JOBS: "4"
      CARGO_PROFILE_RELEASE_DEBUG: "0"
      CARGO_PROFILE_RELEASE_LTO: "false"
      CARGO_INCREMENTAL: "0"
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      RUSTUP_TOOLCHAIN: "1.96.0"
      RUSTFLAGS: '--cfg zcash_unstable="nu6.3"'
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      # Read-only, and only so the pin check can see which network the pinned
      # SDK targets and so its licence ships with the binary. Cargo fetches its
      # own copy of the same revision for the compile.
      - name: Check out the pinned SDK revision
        uses: actions/checkout@v4
        with:
          repository: Swarm-Official/privacy-zingolib
          ref: d9f1a5b888067724b61b2fae46307ed56b4b1e0a
          path: sdk-source
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: yarn
      - name: Restore compiled Rust outputs
        id: rust-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/target
            vendor/zingolib/zingo-netutils/target
          key: swarm-windows-rust196-nu63-${{ hashFiles('native/Cargo.lock', 'native/src/lib.rs', 'native/src/treasury.rs', 'native/treasury-core/src/lib.rs', 'sdk/swarm-sdk-pin.json') }}
          restore-keys: swarm-windows-rust196-nu63-
      - name: Install pinned Protocol Buffers compiler
        uses: arduino/setup-protoc@v3
        with:
          version: '36.2'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify Protocol Buffers compiler
        run: protoc --version
      - name: Install build prerequisites
        shell: pwsh
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          rustup default 1.96.0
          npm install --global yarn@1.22.22
      - name: Install locked JavaScript dependencies
        run: yarn install --frozen-lockfile
      # Which network this build is for, written into the tree before anything
      # reads it: the renderer's branding, the version, the product name, the
      # app id and the installer's file name all come from src/buildProfile.json.
      # The node app does the same thing with the same input
      # (scripts/set-build-profile.mjs there). Default swarm-testnet, so a
      # `swarm-build-*` tag push keeps producing exactly what it produced before.
      - name: Select the network this build is for
        run: node scripts/set-build-profile.js
        env:
          SWARM_NETWORK_PROFILE: ${{ inputs.network_profile || 'swarm-testnet' }}
      - name: Validate the complete Windows packaging configuration
        run: node scripts/check-swarm-package-config.js
      # Everything cheap that can refuse the build runs before the hour of
      # compilation, not after it.
      # `--require-real-genesis` is unconditional now. It existed to stop a
      # build shipping the SDK's genesis placeholder while SwarmTestnet had no
      # genesis block; the network has one, so every build from here must
      # carry it and there is no longer a reason to let that gate be switched
      # off by whoever presses the button.
      - name: Verify the pinned SDK revision and its network
        run: node scripts/check-swarm-sdk-pin.js sdk-source --require-real-genesis
      # Normally `--locked`: a build whose dependency graph moved under it is
      # not the build that was reviewed. The Treasury page added four
      # dependencies (swarm-treasury, zebra-chain, age, sha2) on a machine
      # with no Rust toolchain, so there was no way to resolve the lockfile
      # before pushing. This run resolves it, uploads it, and SAYS SO; the
      # lock is committed from that artifact and this step goes back to
      # being `--locked` alone.
      - name: Check the lockfile resolves without changes
        shell: pwsh
        run: |
          cargo fetch --locked --manifest-path native/Cargo.toml
          if ($LASTEXITCODE -ne 0) {
            Write-Output "::warning::native/Cargo.lock does not cover this manifest; resolving it in this run"
            cargo fetch --manifest-path native/Cargo.toml
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
      - name: Generate the empty optional swap configuration
        run: node scripts/generate-swapkit-secrets.js
      - name: Check the frontend types
        run: yarn tsc --noEmit
      - name: Prevent overlapping payments and misleading cancellation
        run: node scripts/test.js --watchAll=false --runInBand src/rpc/sendTransaction.test.ts src/components/errorModal/ErrorModal.test.tsx
      - name: Keep wallet sessions and mining receipts isolated
        run: node scripts/test.js --watchAll=false --runInBand src/rpc/walletSession.test.ts src/rpc/fetchValueTransferData.test.ts src/components/swarm/swarmModel.test.ts
      - name: Check the treasury custody surface
        run: node scripts/test.js --watchAll=false --runInBand src/treasury src/components/swarm/components/PassphrasePrompt.test.tsx
      - name: Verify network, endpoint and server-selection boundaries
        run: node scripts/test.js --watchAll=false --runInBand src/utils/fetchServerList.test.ts src/utils/utils.test.ts src/components/addNewWallet/AddNewWallet.test.tsx src/components/dashboard/Dashboard.test.tsx src/components/send/Send.test.tsx
      - name: Build the pinned wallet SDK adapter
        run: yarn neon-win-x64
      # The addon's treasury tests: the published fixture scalars reproduce
      # the published 2-of-3 script hash, a signer backup opens without
      # handing back its scalar, a relay blob round trips, and two machines
      # sign one proposal that the script interpreter then accepts. They run
      # here because this is the only machine in the pipeline with a Rust
      # toolchain.
      - name: Prove the treasury bindings sign what they say they sign
        run: cargo test --release --manifest-path native/Cargo.toml -p swarm-wallet-treasury-core
      - name: Verify native prefix compatibility
        run: node scripts/check-swarm-prefix-native.js
      - name: Verify native payment URI parsing
        run: node scripts/test.js --watchAll=false --runInBand src/utils/uris.test.js
      # See the lockfile note above: a warning on this branch until the
      # resolved lock is committed, then `git diff --exit-code` again.
      - name: Check Rust dependency pins
        shell: pwsh
        run: |
          git diff --exit-code -- native/Cargo.lock
          if ($LASTEXITCODE -ne 0) {
            Write-Output "::warning::native/Cargo.lock changed during this build; commit the uploaded lockfile"
          }
      - name: Keep the resolved lockfile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-cargo-lock-${{ inputs.network_profile || 'swarm-testnet' }}
          path: native/Cargo.lock
          if-no-files-found: error
      - name: Build the matching upstream transport helper
        run: node scripts/stage-nym-proxy.js --strict-rev --target x86_64-pc-windows-msvc
      - name: Save successful Rust outputs before packaging
        if: steps.rust-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/target
            vendor/zingolib/zingo-netutils/target
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}
      - name: Build the desktop frontend
        run: yarn script:build
        env:
          CI: ""
      # Build ec77dc96 shipped an unlock screen reading "Zingo PC is locked"
      # under a window titled "SWARM Wallet (Testnet)". Every check that ran
      # looked at package metadata and passed; the wrong string was inside a
      # renderer chunk. This reads the chunks.
      - name: Check the renderer shows no upstream naming
        run: node scripts/check-swarm-bundle-strings.js --renderer build/static/js
      - name: Stage the Windows runtime
        run: node scripts/stage-vcruntime.js --arch x64
      - name: Verify binary architecture
        run: node scripts/check-win-arch.js --arch x64
      - name: Record compiled input provenance
        run: git rev-parse HEAD | Set-Content compile-source-commit.txt
      - name: Preserve compiled app inputs before packaging
        uses: actions/upload-artifact@v4
        with:
          name: swarm-wallet-windows-compiled-inputs-${{ inputs.network_profile || 'swarm-testnet' }}
          path: |
            build/
            src/native.node
            resources/nym-proxy.exe
            resources/vcruntime/
            node_modules/keytar/build/Release/keytar.node
            native/Cargo.lock
            sdk/swarm-sdk-pin.json
            sdk-integration.json
            compile-source-commit.txt
          retention-days: 7
      # No target list here on purpose. The config declares ["zip", "nsis"];
      # naming targets again on the command line overrides it, and this line
      # said only `zip`, so the one-click installer was never built and the
      # smoke test that installs it could not have passed on any run. The
      # config is now the only place targets are decided.
      - name: Package the unsigned test wallet
        run: yarn electron-builder --win --x64 --config configs/swarm-builder.cjs --publish never
      - name: Check every declared package target was produced
        run: node scripts/check-swarm-dist-targets.js win
      - name: Record whether the wallet server was reachable from this runner
        run: node scripts/swarm-reachability.js
      - name: Check the packaged application shows no upstream naming
        run: node scripts/check-swarm-bundle-strings.js --asar dist/win-unpacked --renderer build/static/js
      # Installs the one-click installer into a throwaway profile, starts what
      # it installed, proves it looks for a wallet in the same place the
      # portable build does, and uninstalls. Nothing is installed on the
      # runner outside that profile and no shortcut outlives it.
      - name: Smoke-test the installer and the portable build
        run: node scripts/swarm-smoke-windows.js
      # Whatever the smoke test saw, kept whether it passed or failed: the
      # screen, the renderer console, the profile tree and the process output.
      # A failure should cost one look, not another three-platform cycle.
      - name: Keep what the smoke test saw
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swarm-smoke-diagnostics-windows-${{ inputs.network_profile || 'swarm-testnet' }}
          path: dist/smoke-diagnostics/
          if-no-files-found: ignore
          retention-days: 14
      - name: Record build provenance and checksums
        shell: pwsh
        run: |
          git rev-parse HEAD | Set-Content dist/source-commit.txt
          Get-FileHash dist/*.zip, dist/*.exe -Algorithm SHA256 | Format-List | Out-File dist/SHA256SUMS.txt
          Copy-Item native/Cargo.lock dist/Cargo.lock
          Copy-Item sdk-integration.json dist/sdk-integration.json
          Copy-Item src/buildProfile.json dist/build-profile.json
      - uses: actions/upload-artifact@v4
        with:
          name: swarm-wallet-windows-x64-unsigned-${{ inputs.network_profile || 'swarm-testnet' }}
          path: |
            dist/*.zip
            dist/*.exe
            dist/SHA256SUMS.txt
            dist/source-commit.txt
            dist/Cargo.lock
            dist/sdk-integration.json
            dist/build-profile.json
          retention-days: 14
