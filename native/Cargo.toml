# A workspace, since the Treasury page: `treasury-core` is a member rather
# than a standalone package so that the `[patch.crates-io]` table at the
# bottom of this file — the four vendored crates that teach the zcash stack
# about the SWARM domain — reaches it. A standalone package would resolve
# unpatched crates and fail to compile against the SDK's `NetworkType::SwarmMain`.
[workspace]
members = ["treasury-core"]

[package]
name = "zingolib-native"
version = "0.1.0"
authors = ["James Katz", "ZL Viridian <zingo@zingolabs.com>"]
license = "ISC"
edition = "2021"
exclude = ["native.node"]

[lib]
crate-type = ["cdylib"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
# Ironwood (NU6.3). Versions match the zingolib lockfile at the commit this
# resolves to: mostly published crates.io zcash crates, plus a few from
# librustzcash git (zcash_pool_migration, zcash_primitives 0.30) that the branch
# needs, pinned in Cargo.lock (see the [patch] note below). Ground truth = that
# Cargo.lock, not zingo-mobile's manifest. Build with `yarn neon` (needs
# `protoc` on PATH).
#
# History of the previous dev pin, kept because the constraints it records
# still hold: fix/for-zingo-pc-working (the boundary-carrier serde mint on
# MixnetStatus + the Nym surface) merged via PR #2610, so dev now carries
# attach_mixnet, the five-state Mixnet Mode, the MixnetStatus wire (with its
# follow-up mode-scoping-on-lift hardening), the treestate fix, and the private
# ironwood migration. Price is mixnet-only: update_current_price is
# #[cfg(feature="nym")] and returns MixnetPriceFetch with no clearnet tier, so
# zec_price_over_mixnet reads its .usd. The critical rc.1 lockfile crates match
# (zcash_client_backend 0.24.0-rc.1, crypto-common rc.1, zcash_primitives 0.29
# crates.io + 0.30 git coexist, orchard 0.15.4). See the [patch] note below on
# the librustzcash rev pin zcash_pool_migration requires.
#
# The OP_RETURN work (zingolib PR #2469) has landed on dev, so the fork pin is
# gone and these follow zingolabs/zingolib. By rev rather than by branch, so a
# build stays reproducible (ADR 0024 rule 7); bump it deliberately.
#
# dev renamed the surface swaps depend on: OpReturnData moved to
# wallet::transparent, and the one-step propose_swap_deposit became
# propose_send_with_op_return, which stores a proposal that
# send_stored_proposal then transmits, resuming at the OP_RETURN step when the
# deshield already went out. The native layer was adapted to that shape
# alongside this bump.
#
# `perspective` is the editorial layer (value transfers, messages, the
# total_*_to_address reductions), behind a default-off feature, so the UI's
# read model has to opt in.
#
# This bump (3fdd4e66 -> ec4547c8) splits the send route from the price route.
# Transmissions now follow a per-session `mixnet::TransmitPolicy` instead of
# the transport's own switched-off state, and `disable_mixnet` deliberately
# leaves that policy alone. Since a session starts under `Mixnet`, the native
# `stop_mixnet` sets the policy to `Clearnet` itself — without it, switching
# Mixnet Mode off would leave every send refusing as "the Nym mixnet is not
# enabled", which is the opposite of what this app's off switch means.
#
# The price fetch went the other way: it is mixnet-only in every state now,
# switched-off included, so with Mixnet Mode off there is no ZEC price at all.
# The dashboard says so rather than showing dashes that look like a hung fetch.
#
# Also gone: `PriceFetchRoute::Clearnet` and `LightClientError::ProbeRequiresMixnet`,
# neither of which this crate named.
# SwarmTestnet build: the project's SDK fork, pinned by revision rather than
# reconstructed from a patch snapshot.
#
# WARNING: d9f1a5b888067724b61b2fae46307ed56b4b1e0a exists only on the local
# branch `codex/mainnet-sdk-identity-20260925` in the SDK worktree; it has NOT
# been pushed to Swarm-Official/privacy-zingolib. Until it is, `cargo fetch`
# cannot resolve it from the URL below, and neither this crate nor CI will
# build. Push the SDK branch first. That revision is where
# `ChainType::SwarmMainnet(SwarmMainnetGenesis)` and the SwarmMain network type
# come from. By rev and not by branch, so the build
# stays reproducible (ADR 0024 rule 7); bump it deliberately. The same revision
# is recorded in sdk/swarm-sdk-pin.json, and scripts/check-swarm-sdk-pin.js
# checks this file, the lockfile and the pinned SDK's own genesis constant
# against it before anything is compiled.
zingolib = { features = ["nym", "perspective"], git = "https://github.com/Swarm-Official/privacy-zingolib", rev = "d9f1a5b888067724b61b2fae46307ed56b4b1e0a" }
pepper-sync = { git = "https://github.com/Swarm-Official/privacy-zingolib", rev = "d9f1a5b888067724b61b2fae46307ed56b4b1e0a" }
# `globally-public-transparent` is what the Treasury page's fund balances are
# read through: `TransparentIndexer::get_address_utxos`, the lightwalletd call
# every Zaino serves. The feature is named after the fact that transparent
# data is public and that asking for it tells the indexer which addresses you
# care about; a treasury fund's P2SH address is published in the genesis
# manifest, so there is nothing here to leak that is not already printed.
zingo-netutils = { features = ["globally-public-transparent"], git = "https://github.com/Swarm-Official/privacy-zingolib", rev = "d9f1a5b888067724b61b2fae46307ed56b4b1e0a" }

# -- the treasury custody surface ---------------------------------------------
#
# The work is in the crate beside this one, which has no Node in it: a test
# binary built from THIS crate would have nothing to resolve Node's symbols
# against, so a treasury surface living here could never be tested, and a
# treasury surface that cannot be tested is one nobody should sign with.
# `native/src/treasury.rs` is the Neon glue; `cargo test -p
# swarm-wallet-treasury-core` is where the fixture scalars, the sign/combine
# round trip and the script-interpreter check actually run.
#
# It brings `swarm-treasury`, and with it `zebra-chain` and `zebra-script`,
# into this build's graph. Their zcash crate versions are the ones this
# manifest already pins (zcash_address 0.13, zcash_protocol 0.10,
# zcash_primitives 0.30, zcash_transparent 0.10, orchard 0.15), so the graph
# unifies and the four vendored SWARM patches below apply on the treasury
# path too.
swarm-wallet-treasury-core = { path = "treasury-core" }

# Read directly for exactly one thing: whether the transaction that funded an
# output was a coinbase transaction. `GetAddressUtxos` does not say, and it
# decides both the hundred-confirmation maturity rule the page shows and the
# `is_coinbase` the proposal records. Same revision as the custody tool the
# core crate pins, so cargo resolves one checkout.
zebra-chain = { git = "https://github.com/Swarm-Official/privacy-zebra", rev = "01b9da3de144a6deb4dd631396cbbc3bfb7c6d81" }

serde = { version = "1", features = ["derive"] }

[dependencies.neon]
version = "1"
default-features = true

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = ["Security_Credentials_UI"] }

[build-dependencies]
cc = "1"

# Only the patches the zingolib branch actually needs (per its Cargo.lock): a
# dependency's own [patch] table is ignored by cargo, so this must be replicated
# here. lightwallet-protocol carries the Ironwood proto fields (its
# `rebuild-proto` feature needs `protoc` on PATH).
#
# librustzcash rev pin lives in Cargo.lock, NOT here. zingolib depends on
# zcash_pool_migration (and, transitively, zcash_primitives 0.30 / zcash_address
# / zcash_protocol / equihash / f4jumble / zcash_transparent) from
# librustzcash's git DEFAULT BRANCH with no rev, so a bare `cargo update` floats
# them to main's tip, where the migration denomination constants
# (MIGRATION_MAX_DENOMINATION_ZEC, RESIDUAL_MIGRATION_MIN) were renamed and
# zingolib no longer compiles. The lock is pinned to e12f1d0f, matching the
# branch's own Cargo.lock. After any float, re-pin with
# `cargo update -p zcash_pool_migration --precise e12f1d0ff7be5e5bfd2e4bcbb8d9a863a405f031`.
#
# SWARM production identity: four crates are vendored, not two. The SDK
# revision this crate is pinned at admits `NetworkType::SwarmMain` and
# `BranchId::SwarmMain`, and two further crates match those enums
# exhaustively, so they do not compile against the patched protocol crate
# unless they are patched too:
#
#   zcash_transparent  `zip48::pub_prefix` answers `None` for SwarmMain rather
#                      than reusing Zcash's `xpub`/`tpub`.
#   zcash_primitives   `TxVersion::suggested_for_branch`, its three
#                      `valid_in_branch` arms and the builder's Ironwood gate
#                      answer for the SWARM domain what they answer for NU6.3.
#
# Both are pristine crates.io archives of the versions Cargo.lock already
# pinned, with the SDK's modifications applied on top; see vendor/README.md for
# the versions and the archive SHA-256s.
[patch.crates-io]
zcash_address = { path = "vendor/zcash_address" }
zcash_protocol = { path = "vendor/zcash_protocol" }
zcash_primitives = { path = "vendor/zcash_primitives" }
zcash_transparent = { path = "vendor/zcash_transparent" }
time = { git = "https://github.com/time-rs/time", tag = "v0.3.47" }
lightwallet-protocol = { git = "https://github.com/zingolabs/lightwallet-protocol-rust", rev = "9bdfdc77eb283f2a3d26c27100cc2ac90148cd93" }

[profile.release]
debug = 1
# panic strategy: intentionally left at the default ("unwind").
#
# Switching to `panic = "abort"` would shrink the MAS binary slightly and is
# tempting from a security-hardening angle, but it is incompatible with the
# `with_panic_guard` infrastructure used throughout this crate. That guard
# wraps every FFI entry point in `panic::catch_unwind`, converting transient
# panics (zingolib internal bugs, lock poisoning, etc.) into a recoverable
# `ZingolibError::Panic` returned to JS. With `abort`, those panics would
# instead terminate the wallet process. The unwind/resilience trade-off was
# made deliberately at the architecture level — do not flip this flag without
# first removing `with_panic_guard` everywhere and propagating errors via
# `Result` only.
